<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>AMG · Anunci ajut Felanitx franja (escala de grisos)</title>
<style>
  /* Franja 120 x 30 mm · ESCALA DE GRISOS · logo + bloc de text, net, sense caixes ni QR */
  :root { --ink:#111; --gray:#4b4b4b; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:#e2e8f0; }
  body { font-family:-apple-system,'Segoe UI',Roboto,sans-serif; display:flex; justify-content:center; padding:20px; }

  .anunci {
    width:120mm; height:35mm; background:#fff; border:2px solid #111;
    display:flex; align-items:center; gap:5mm; padding:4mm 6mm; overflow:hidden;
  }
  .left { flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:1mm; }
  .left .logo { width:34mm; height:7.5mm;
    background:url("amg-logo-black.png") center/contain no-repeat; }
  .left .qr { width:15mm; height:15mm; }

  .content { flex:1; text-align:center; color:var(--ink); display:flex; flex-direction:column; gap:1.3mm; }
  .claim { font-size:11pt; font-weight:800; line-height:1; }
  .hook { font-size:9.5pt; font-weight:700; line-height:1.05; }
  .hook .big { font-size:11.5pt; font-weight:900; margin-right:3px; }
  .serveis { font-size:7.5pt; font-weight:700; color:var(--gray); line-height:1; }
  .catala { text-align:center; font-size:8pt; font-weight:800; color:var(--ink); }
  .contact { font-size:11pt; font-weight:800; letter-spacing:.2px; line-height:1; margin-top:.5mm; }
  .contact .web { font-weight:700; }

  @media print {
    html,body { background:#fff; padding:0; }
    .anunci { border:2px solid #111; }
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
  @page { size:120mm 35mm; margin:0; }
</style>
</head>
<body>
<div class="anunci">
  <div class="left">
    <div class="logo" role="img" aria-label="AMG Digitalitzacions"></div>
    <img class="qr" src="qr-wa-felanitx.png" alt="QR WhatsApp AMG">
  </div>
  <div class="content">
    <div class="claim">Digitalitzam el teu negoci</div>
    <div class="hook"><span class="big">50%</span>subvencionat per l'Ajuntament de Felanitx · fins a 1.000&nbsp;€</div>
    <div class="serveis">Web · Xarxes socials · Assistent IA per WhatsApp</div>
    <div class="catala">✔ Tot en català</div>
    <div class="contact">☎ 654&nbsp;048&nbsp;164&nbsp;&nbsp;·&nbsp;&nbsp;<span class="web">amgdl.com</span></div>
  </div>
</div>
</body>
</html>
