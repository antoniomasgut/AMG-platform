<?xml version="1.0" encoding="UTF-8"?>
<!--
  AMG Digitalitzacions — Concepte 03: Quadrat Circuit
  200×200 · fons fosc
-->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <title>AMG Digitalitzacions — Concepte 03 Circuit</title>
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <pattern id="gr3" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none"
            stroke="#FF6B00" stroke-width="0.4" stroke-opacity="0.07"/>
    </pattern>
    <filter id="gw3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sq3clip">
      <polygon points="178,6 194,22 194,194 22,194 6,178 6,6"/>
    </clipPath>
  </defs>

  <!-- Fons base -->
  <rect width="200" height="200" fill="url(#bg3)"/>

  <!-- Contenidor card-clip principal -->
  <polygon points="178,6 194,22 194,194 22,194 6,178 6,6"
           fill="#13132a"
           stroke="#FF6B00" stroke-width="1.2" stroke-opacity="0.28"/>

  <!-- Quadrícula interior (clip-path per contenir-la) -->
  <rect width="200" height="200" fill="url(#gr3)" clip-path="url(#sq3clip)"/>

  <!-- Cantonades decoratives de circuit (L-shapes) -->
  <polyline points="6,46  6,6  46,6"  fill="none" stroke="#FF6B00" stroke-width="1.8" stroke-opacity="0.65"/>
  <polyline points="154,6  194,6  194,46" fill="none" stroke="#FF6B00" stroke-width="1.8" stroke-opacity="0.65"/>
  <polyline points="6,154  6,194  46,194" fill="none" stroke="#FF6B00" stroke-width="1.8" stroke-opacity="0.65"/>
  <polyline points="154,194  194,194  194,154" fill="none" stroke="#FF6B00" stroke-width="1.8" stroke-opacity="0.65"/>

  <!-- Nodes quadrats a les cantonades -->
  <rect x="3.5"   y="3.5"   width="5" height="5" fill="#FF6B00" filter="url(#gw3)"/>
  <rect x="191.5" y="3.5"   width="5" height="5" fill="#FF6B00"/>
  <rect x="3.5"   y="191.5" width="5" height="5" fill="#FF6B00"/>
  <rect x="191.5" y="191.5" width="5" height="5" fill="#FF6B00"/>

  <!-- Línies horitzontals decoratives (dalt i baix del text) -->
  <line x1="26" y1="74"  x2="174" y2="74"  stroke="#FF6B00" stroke-width="0.6" stroke-opacity="0.18"/>
  <line x1="26" y1="152" x2="174" y2="152" stroke="#FF6B00" stroke-width="0.6" stroke-opacity="0.18"/>

  <!-- Petits nodes als extrems de les línies -->
  <rect x="23" y="71.5" width="4" height="4" fill="#FF6B00" fill-opacity="0.50"/>
  <rect x="173" y="71.5" width="4" height="4" fill="#FF6B00" fill-opacity="0.50"/>
  <rect x="23" y="149.5" width="4" height="4" fill="#FF6B00" fill-opacity="0.50"/>
  <rect x="173" y="149.5" width="4" height="4" fill="#FF6B00" fill-opacity="0.50"/>

  <!-- AMG centrat (el protagonista) -->
  <text x="100" y="130"
        text-anchor="middle"
        font-family="Orbitron, 'Share Tech Mono', monospace"
        font-size="50" font-weight="900"
        fill="#FF6B00"
        letter-spacing="2"
        filter="url(#gw3)">AMG</text>

  <!-- DIGITALITZACIONS -->
  <text x="100" y="171"
        text-anchor="middle"
        font-family="'Space Grotesk', system-ui, sans-serif"
        font-size="9.5" font-weight="400"
        fill="#8896aa"
        letter-spacing="4.5">DIGITALITZACIONS</text>
</svg>
