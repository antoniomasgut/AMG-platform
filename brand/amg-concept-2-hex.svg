<?xml version="1.0" encoding="UTF-8"?>
<!--
  AMG Digitalitzacions — Concepte 02: Monograma Hexagonal
  200×200 · fons fosc
-->
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <title>AMG Digitalitzacions — Concepte 02 Hexagonal</title>
  <defs>
    <radialGradient id="bg2" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <filter id="gw2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Gradient interior hexàgon -->
    <radialGradient id="hexFill" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0.01"/>
    </radialGradient>
  </defs>

  <!-- Fons -->
  <rect width="200" height="200" fill="url(#bg2)"/>

  <!-- Hexàgon exterior (flat-top, r=90) -->
  <!-- 0°(190,100) 60°(145,22) 120°(55,22) 180°(10,100) 240°(55,178) 300°(145,178) -->
  <polygon points="190,100 145,22 55,22 10,100 55,178 145,178"
           fill="url(#hexFill)"
           stroke="#FF6B00" stroke-width="1.5" stroke-opacity="0.45"/>

  <!-- Hexàgon interior (ring intern, r=72) -->
  <!-- 0°(172,100) 60°(136,38) 120°(64,38) 180°(28,100) 240°(64,162) 300°(136,162) -->
  <polygon points="172,100 136,38 64,38 28,100 64,162 136,162"
           fill="none"
           stroke="#FF6B00" stroke-width="0.5" stroke-opacity="0.12"
           stroke-dasharray="5 8"/>

  <!-- Línies de connexió entre lletres (circuit intern) -->
  <!-- Nodes: A=(100,62) M=(68,130) G=(132,130) -->
  <line x1="100" y1="68" x2="68"  y2="124" stroke="#FF6B00" stroke-width="0.75" stroke-opacity="0.28"/>
  <line x1="100" y1="68" x2="132" y2="124" stroke="#FF6B00" stroke-width="0.75" stroke-opacity="0.28"/>
  <line x1="68"  y1="124" x2="132" y2="124" stroke="#FF6B00" stroke-width="0.75" stroke-opacity="0.28"/>

  <!-- Nodes de connexió -->
  <circle cx="100" cy="68"  r="3.5" fill="#FF6B00" fill-opacity="0.50" filter="url(#gw2)"/>
  <circle cx="68"  cy="124" r="3"   fill="#FF6B00" fill-opacity="0.40"/>
  <circle cx="132" cy="124" r="3"   fill="#FF6B00" fill-opacity="0.40"/>

  <!-- Lletra A (superior centrada) -->
  <text x="100" y="84"
        text-anchor="middle"
        font-family="Orbitron, 'Share Tech Mono', monospace"
        font-size="32" font-weight="900"
        fill="#FF6B00"
        filter="url(#gw2)">A</text>

  <!-- Lletra M (inferior esquerra) -->
  <text x="66" y="148"
        text-anchor="middle"
        font-family="Orbitron, 'Share Tech Mono', monospace"
        font-size="28" font-weight="700"
        fill="#FF6B00">M</text>

  <!-- Lletra G (inferior dreta) -->
  <text x="134" y="148"
        text-anchor="middle"
        font-family="Orbitron, 'Share Tech Mono', monospace"
        font-size="28" font-weight="700"
        fill="#FF6B00">G</text>

  <!-- Vèrtexs del hexàgon exteriors decoratius -->
  <circle cx="190" cy="100" r="3" fill="#FF6B00" fill-opacity="0.30"/>
  <circle cx="145" cy="22"  r="3" fill="#FF6B00" fill-opacity="0.30"/>
  <circle cx="55"  cy="22"  r="3" fill="#FF6B00" fill-opacity="0.30"/>
  <circle cx="10"  cy="100" r="3" fill="#FF6B00" fill-opacity="0.30"/>
  <circle cx="55"  cy="178" r="3" fill="#FF6B00" fill-opacity="0.30"/>
  <circle cx="145" cy="178" r="3" fill="#FF6B00" fill-opacity="0.30"/>
</svg>
