<?xml version="1.0" encoding="UTF-8"?>
<!-- AMG Digitalitzacions — Logo horitzontal animat (340×84) -->
<svg width="340" height="84" viewBox="0 0 340 84" xmlns="http://www.w3.org/2000/svg">
  <title>AMG Digitalitzacions — Logo horitzontal</title>
  <defs>
    <linearGradient id="triH" x1="38" y1="8" x2="38" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glH" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glHsig" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Icona (0-76px) ── -->
  <polygon points="68,0 76,8 76,84 8,84 0,76 0,0"
           fill="#13132a" stroke="#FF6B00" stroke-width="0.75" stroke-opacity="0.22"/>

  <!-- Ompliment triangle -->
  <polygon points="38,8 8,76 68,76" fill="url(#triH)"/>

  <!-- Cables wire -->
  <line x1="38" y1="8"  x2="8"  y2="76" stroke="#FF6B00" stroke-width="2.5" stroke-opacity="0.22" stroke-linecap="square"/>
  <line x1="38" y1="8"  x2="68" y2="76" stroke="#FF6B00" stroke-width="2.5" stroke-opacity="0.22" stroke-linecap="square"/>
  <line x1="18" y1="49" x2="58" y2="49" stroke="#FF6B00" stroke-width="2.5" stroke-opacity="0.22" stroke-linecap="square"/>

  <!-- Senyals animats
       Velocitat: 206px/2s ≈ 103px/s
       Cama (≈74px): transit ≈0.72s
       Barra inicia quan senyal arriba a CL (apex→CL≈46px → t≈0.45s) -->
  <line x1="38" y1="8"  x2="8"  y2="76"
        stroke="#FF9A3C" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="7 400" filter="url(#glHsig)">
    <animate attributeName="stroke-dashoffset" from="0" to="-407" dur="2s" repeatCount="indefinite" begin="0s"/>
  </line>
  <line x1="38" y1="8"  x2="68" y2="76"
        stroke="#FF9A3C" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="7 400" filter="url(#glHsig)">
    <animate attributeName="stroke-dashoffset" from="0" to="-407" dur="2s" repeatCount="indefinite" begin="0.18s"/>
  </line>
  <line x1="18" y1="49" x2="58" y2="49"
        stroke="#FF9A3C" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="7 400" filter="url(#glHsig)">
    <animate attributeName="stroke-dashoffset" from="0" to="-407" dur="2s" repeatCount="indefinite" begin="0.45s"/>
  </line>

  <!-- Nodes cercles buits -->
  <circle cx="38" cy="8"  r="4.5" fill="#13132a" stroke="#FF6B00" stroke-width="2.5" filter="url(#glH)">
    <animate attributeName="stroke-opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="8"  cy="76" r="4.5" fill="#13132a" stroke="#FF6B00" stroke-width="2.5">
    <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite" begin="0.72s"/>
  </circle>
  <circle cx="68" cy="76" r="4.5" fill="#13132a" stroke="#FF6B00" stroke-width="2.5">
    <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite" begin="0.90s"/>
  </circle>
  <circle cx="18" cy="49" r="4.5" fill="#13132a" stroke="#FF6B00" stroke-width="2.5">
    <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite" begin="0.45s"/>
  </circle>
  <circle cx="58" cy="49" r="4.5" fill="#13132a" stroke="#FF6B00" stroke-width="2.5">
    <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite" begin="0.84s"/>
  </circle>

  <!-- ── Separador ── -->
  <line x1="94" y1="12" x2="94" y2="72" stroke="#FF6B00" stroke-width="0.75" stroke-opacity="0.22"/>

  <!-- ── Wordmark ── -->
  <text x="108" y="51"
        font-family="Orbitron, 'Share Tech Mono', monospace"
        font-size="36" font-weight="700" fill="#FF6B00" letter-spacing="5">AMG</text>
  <text x="110" y="70"
        font-family="'Space Grotesk', system-ui, sans-serif"
        font-size="11" font-weight="400" fill="#8896aa" letter-spacing="5.5">DIGITALITZACIONS</text>
</svg>
