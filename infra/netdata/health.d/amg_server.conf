# AMG Digitalització — Alertes de servidor personalitzades

# ── CPU ────────────────────────────────────────────────────────────────────────
alarm: amg_cpu_high
   on: system.cpu
 calc: $user + $system + $softirq + $irq + $guest
units: %
every: 1m
 warn: $this > 80
 crit: $this > 95
delay: up 5m down 10m multiplier 1.5 max 2h
 info: ⚠️ CPU usage alta — considera ampliar a 8 vCPU (CX31)
   to: sysadmin

# ── RAM ────────────────────────────────────────────────────────────────────────
alarm: amg_ram_high
   on: system.ram
 calc: ($used / ($used + $free + $buffers + $cached)) * 100
units: %
every: 1m
 warn: $this > 80
 crit: $this > 90
delay: up 5m down 10m multiplier 1.5 max 2h
 info: ⚠️ RAM alta — considera ampliar a 16 GB o separar la DB a VPS dedicat
   to: sysadmin

# ── Disc ───────────────────────────────────────────────────────────────────────
alarm: amg_disk_space_high
   on: disk_space._
 calc: $used * 100 / ($used + $avail)
units: %
every: 5m
 warn: $this > 75
 crit: $this > 90
delay: up 1m down 5m
 info: ⚠️ Disc quasi ple — allibera espai o amplia el volum
   to: sysadmin

# ── Swapping (senyal de falta de RAM) ──────────────────────────────────────────
alarm: amg_swap_usage
   on: mem.swap
 calc: $used * 100 / ($used + $free)
units: %
every: 1m
 warn: $this > 20
 crit: $this > 50
delay: up 5m down 15m
 info: ⚠️ S'està usant swap — RAM insuficient, considera ampliar
   to: sysadmin

# ── Docker contenidors caiguts ─────────────────────────────────────────────────
alarm: amg_docker_containers_down
   on: docker.containers_status
every: 30s
 warn: $exited > 0
 crit: $exited > 2
delay: up 0m down 5m
 info: ⚠️ Contenidors Docker aturats detectats
   to: sysadmin
