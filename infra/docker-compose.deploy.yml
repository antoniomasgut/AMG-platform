services:

  backend:
    image: infra-backend:latest
    pull_policy: never
    container_name: amg_backend
    restart: unless-stopped
    networks:
      - coolify
      - amg-network
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://amg-postgres:5432/amg
      SPRING_DATASOURCE_USERNAME: amg
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: amg-redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: amg-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JASYPT_ENCRYPTOR_PASSWORD: ${JASYPT_ENCRYPTOR_PASSWORD}
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      DEMO_TENANT_ID: ${DEMO_TENANT_ID}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.amgdl.com`)"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
      - "traefik.http.routers.backend.middlewares=secureHeaders,rateLimit,corsApi@file"

  amg_frontend:
    image: infra-frontend:latest
    pull_policy: never
    container_name: amg_frontend
    restart: unless-stopped
    networks:
      - coolify
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.amgdl.com
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`amgdl.com`) || Host(`www.amgdl.com`)"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.frontend.middlewares=secureHeaders"

networks:
  coolify:
    external: true
  amg-network:
    external: true
