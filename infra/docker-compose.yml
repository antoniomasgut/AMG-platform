services:

  # NOTA (2026-07-12): el servei `traefik` (amg_traefik) s'ha ELIMINAT. No podia arrencar
  # (conflicte de ports 80/443 amb coolify-proxy, el Traefik de Coolify que ja encamina tot
  # el trànsit real) i, per tant, era un contenidor mort permanent. El routing va per
  # coolify-proxy (labels traefik.docker.network=coolify a backend/frontend). Si mai es volen
  # landings de domini propi, cal encaminar-les per coolify-proxy, no per un Traefik propi.

  postgres:
    image: postgres:16-alpine
    container_name: amg_postgres
    restart: unless-stopped
    profiles: ["infra"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amg_platform}
      POSTGRES_USER: ${POSTGRES_USER:-amg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - amg_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amg} -d ${POSTGRES_DB:-amg_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: amg_redis_compose
    restart: unless-stopped
    profiles: ["infra"]
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - amg_net
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: amg_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-amg_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DOMAIN: storage.${APP_DOMAIN}
    volumes:
      - minio_data:/data
    networks:
      - amg_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio-api.rule=Host(`storage.${APP_DOMAIN}`)"
      - "traefik.http.routers.minio-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio-api.service=minio-api-svc"
      - "traefik.http.routers.minio-api.middlewares=secureHeaders,rateLimit"
      - "traefik.http.routers.minio-console.rule=Host(`minio.${APP_DOMAIN}`)"
      - "traefik.http.routers.minio-console.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio-console.service=minio-console-svc"
      - "traefik.http.routers.minio-console.middlewares=secureHeaders,rateLimit"
      - "traefik.http.services.minio-console-svc.loadbalancer.server.port=9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: amg_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-amg-postgres}:5432/${POSTGRES_DB:-amg}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-amg}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-amg-redis}
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
      MINIO_BUCKET: ${MINIO_BUCKET:-amg-assets}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      JASYPT_ENCRYPTOR_PASSWORD: ${JASYPT_ENCRYPTOR_PASSWORD:?JASYPT_ENCRYPTOR_PASSWORD required}
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:?VAULT_MASTER_KEY required}
      HOSTING_DATA_PATH: /data/websites
      DEMO_TENANT_ID: ${DEMO_TENANT_ID}
      APP_HEALTHCHECK_FRONTEND_URL: https://amgdl.com/ca/login
      APP_HEALTHCHECK_TRAEFIK_URL: http://coolify-proxy:80/ping
      STT_API_KEY: ${STT_API_KEY}
      STT_BASE_URL: ${STT_BASE_URL:-https://api.groq.com/openai/v1}
      STT_MODEL: ${STT_MODEL:-whisper-large-v3-turbo}
    volumes:
      # SEGURETAT (2026-07-12): socket de Docker ELIMINAT del backend. El hosting d'imports
      # s'ha rearquitecturat de forma segura: el backend NO toca mai Docker. Els imports
      # ESTÀTICS i les landings del motor els serveix el propi backend (PublicSiteController,
      # per Host), sense contenidor. Els imports de tipus CONTAINER: el backend escriu un
      # manifest a websites_data/_desired/ i l'agent del host (infra/scripts/hosting-reconciler-agent.py,
      # cron) crea el contenidor a la xarxa `coolify`. Veure infra/HOSTING-RUNBOOK.md.
      - websites_data:/data/websites
    networks:
      amg_net: {}
      amg-network: {}
      coolify:
        aliases:
          - amg-backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.backend.rule=Host(`api.${APP_DOMAIN}`)"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.amgdl.com
        NEXT_PUBLIC_SITE_URL: https://amgdl.com
    container_name: amg_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.amgdl.com
      NEXT_PUBLIC_SITE_URL: https://amgdl.com
    depends_on:
      - backend
    networks:
      amg_net: {}
      coolify:
        aliases:
          - amg-frontend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.frontend.rule=Host(`${APP_DOMAIN}`) || Host(`www.${APP_DOMAIN}`)"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

  netdata:
    image: netdata/netdata:stable
    container_name: amg_netdata
    restart: unless-stopped
    pid: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    environment:
      NETDATA_CLAIM_TOKEN: ""
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./netdata/health.d:/etc/netdata/health.d/amg:ro
      - ./netdata/health_alarm_notify.conf:/etc/netdata/health_alarm_notify.conf:ro
    ports:
      - "127.0.0.1:19999:19999"
    networks:
      - amg_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.netdata.rule=Host(`monitor.${APP_DOMAIN}`)"
      - "traefik.http.routers.netdata.tls=true"
      - "traefik.http.routers.netdata.tls.certresolver=letsencrypt"
      - "traefik.http.routers.netdata.middlewares=secureHeaders,auth"
      - "traefik.http.services.netdata.loadbalancer.server.port=19999"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  netdata_config:
  netdata_lib:
  netdata_cache:
  websites_data:

networks:
  amg_net:
    driver: bridge
  amg-network:
    external: true
  coolify:
    external: true
