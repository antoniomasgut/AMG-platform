spring:
  application:
    name: amg-digitalitzacio

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/amg_digitalitzacio}
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    out-of-order: false
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 900000       # 15 min
  refresh-token-expiration: 604800000   # 7 dies

login:
  max-attempts: 3
  lock-duration-minutes: 15

rate-limiting:
  max-attempts-per-email: 5
  max-attempts-per-ip: 20
  window-minutes: 15

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

  storage:
    path: ${STORAGE_PATH:/data/assets}
    max-file-size: 5242880
    thumbnail-width: 200
    thumbnail-height: 200

  finops:
    provider: ${FINOP_PROVIDER:mock}
    holded:
      api-url: https://api.holded.com/api/v1
      api-key: ${HOLDED_API_KEY:}
      webhook-secret: ${HOLDED_WEBHOOK_SECRET:}
    default-due-days: 30

  payments:
    provider: ${PAYMENTS_PROVIDER:mock}
    success-url: ${PAYMENTS_SUCCESS_URL:https://amgdl.com/payments/success}
    cancel-url: ${PAYMENTS_CANCEL_URL:https://amgdl.com/payments/cancel}

  stripe:
    api-key: ${STRIPE_API_KEY:}

  gocardless:
    provider: ${GOCARDLESS_PROVIDER:mock}
    api-url: https://api.gocardless.com
    sandbox-url: https://api-sandbox.gocardless.com
    webhook-secret: ${GOCARDLESS_WEBHOOK_SECRET:}

  prospecting:
    provider: ${PROSPECTING_PROVIDER:mock}
    google:
      places-api-key: ${GOOGLE_PLACES_API_KEY:}
      rate-limit-per-second: 10
    enrichment:
      timeout-seconds: 10
      max-concurrent: 3
    default-max-results: 50

  automations:
    provider: ${AUTOMATIONS_PROVIDER:mock}
    n8n:
      api-url: ${N8N_API_URL:http://localhost:5678/api/v1}
      api-key: ${N8N_API_KEY:}

  backup:
    provider: ${BACKUP_PROVIDER:mock}
    gcs:
      bucket-name: ${GCS_BUCKET_NAME:amg-backups}
      project-id: ${GCS_PROJECT_ID:}

  infraops:
    enabled: true
    collect-cron: "0 */5 * * * ?"
    retention-days: 7
    notification-cooldown-hours: 24
    thresholds:
      cpu-warn: ${INFRAOPS_CPU_WARN_THRESHOLD:80}
      cpu-crit: 95
      ram-warn: ${INFRAOPS_RAM_WARN_THRESHOLD:85}
      ram-crit: 95
      disk-warn: ${INFRAOPS_DISK_WARN_THRESHOLD:75}
      disk-crit: 90
      db-connections-warn: ${INFRAOPS_DB_CONN_WARN_THRESHOLD:80}
      tenants-n8n-warn: 30
      tenants-cloud-warn: 50
    telegram:
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      chat-id: ${TELEGRAM_CHAT_ID:}

  domains:
    provider: mock
    server-ip: ${SERVER_IP:65.108.148.62}
    auto-renew-days-before: 30

  demo:
    tenant-id: ${DEMO_TENANT_ID:}
    email: demo@amgdl.com

  agents:
    telegram:
      bot-token: ${AGENTS_TELEGRAM_BOT_TOKEN:${TELEGRAM_BOT_TOKEN:}}
    conversational:
      claude-model: ${AGENTS_CLAUDE_MODEL:claude-haiku-4-5-20251001}
      anthropic-api-key: ${ANTHROPIC_API_KEY:}
      max-history-messages: 20
      conversation-ttl-hours: 48
    whatsapp:
      twilio-account-sid: ${TWILIO_ACCOUNT_SID:}
      twilio-auth-token: ${TWILIO_AUTH_TOKEN:}
    email:
      brevo-api-key: ${BREVO_API_KEY:}
      brevo-from-address: ${BREVO_FROM_ADDRESS:noreply@amgdl.com}

