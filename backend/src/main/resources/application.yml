spring:
  application:
    name: amg-digitalitzacio

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/amg_digitalitzacio}
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  flyway:
    enabled: false

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 900000       # 15 min
  refresh-token-expiration: 604800000   # 7 dies

login:
  max-attempts: 3
  lock-duration-minutes: 15

rate-limiting:
  max-attempts-per-email: 5
  max-attempts-per-ip: 20
  window-minutes: 15
