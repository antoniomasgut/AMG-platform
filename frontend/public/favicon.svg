<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="triGrad" x1="100" y1="35" x2="100" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="gl" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gls" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <polygon points="184,4 196,16 196,196 16,196 4,184 4,4" fill="#0d0d1a" stroke="#FF6B00" stroke-width="0.75" stroke-opacity="0.20"/>
  <polygon points="100,35 22,170 178,170" fill="url(#triGrad)"/>
  <line x1="100" y1="35" x2="22" y2="170" stroke="#FF6B00" stroke-width="4.5" stroke-opacity="0.22" stroke-linecap="square"/>
  <line x1="100" y1="35" x2="178" y2="170" stroke="#FF6B00" stroke-width="4.5" stroke-opacity="0.22" stroke-linecap="square"/>
  <line x1="48" y1="125" x2="152" y2="125" stroke="#FF6B00" stroke-width="4.5" stroke-opacity="0.22" stroke-linecap="square"/>
  <line x1="100" y1="35" x2="22" y2="170" stroke="#FF9A3C" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 400" filter="url(#gls)">
    <animate attributeName="stroke-dashoffset" from="0" to="-410" dur="2s" repeatCount="indefinite" begin="0s"/>
  </line>
  <line x1="100" y1="35" x2="178" y2="170" stroke="#FF9A3C" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 400" filter="url(#gls)">
    <animate attributeName="stroke-dashoffset" from="0" to="-410" dur="2s" repeatCount="indefinite" begin="0.18s"/>
  </line>
  <line x1="48" y1="125" x2="152" y2="125" stroke="#FF9A3C" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 400" filter="url(#gls)">
    <animate attributeName="stroke-dashoffset" from="0" to="-410" dur="2s" repeatCount="indefinite" begin="0.66s"/>
  </line>
  <circle cx="100" cy="35" r="7" fill="#0d0d1a" stroke="#FF6B00" stroke-width="4.5" filter="url(#gl)">
    <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="22" cy="170" r="7" fill="#0d0d1a" stroke="#FF6B00" stroke-width="4.5">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="178" cy="170" r="7" fill="#0d0d1a" stroke="#FF6B00" stroke-width="4.5">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" begin="1.1s"/>
  </circle>
  <circle cx="48" cy="125" r="7" fill="#0d0d1a" stroke="#FF6B00" stroke-width="4.5">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" begin="0.66s"/>
  </circle>
  <circle cx="152" cy="125" r="7" fill="#0d0d1a" stroke="#FF6B00" stroke-width="4.5">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" begin="1.32s"/>
