  <line x1="100" y1="13.4" x2="175" y2="143.3" stroke="#FF6B00" stroke-width="3.5" stroke-opacity="0.2" stroke-linecap="square"/>
  <line x1="25" y1="143.3" x2="175" y2="143.3" stroke="#FF6B00" stroke-width="3.5" stroke-opacity="0.2" stroke-linecap="square"/>
  <line x1="100" y1="13.4" x2="25" y2="143.3" stroke="#FF9A3C" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 400" filter="url(#gls)">
    <animate attributeName="stroke-dashoffset" from="0" to="-410" dur="2s" repeatCount="indefinite" begin="0s"/>
  </line>
  <line x1="100" y1="13.4" x2="175" y2="143.3" stroke="#FF9A3C" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 400" filter="url(#gls)">
    <animate attributeName="stroke-dashoffset" from="0" to="-410" dur="2s" repeatCount="indefinite" begin="0.2s"/>
  </line>
  <line x1="25" y1="143.3" x2="175" y2="143.3" stroke="#FF9A3C" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 400" filter="url(#gls)">
    <animate attributeName="stroke-dashoffset" from="0" to="-410" dur="2s" repeatCount="indefinite" begin="0.4s"/>
  </line>
  <circle cx="100" cy="13.4" r="8" fill="#0d0d1a" stroke="#FF6B00" stroke-width="4" filter="url(#gl)">
    <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="25" cy="143.3" r="8" fill="#0d0d1a" stroke="#FF6B00" stroke-width="4">
    <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="0.72s"/>
  </circle>
  <circle cx="175" cy="143.3" r="8" fill="#0d0d1a" stroke="#FF6B00" stroke-width="4">
    <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" begin="1.44s"/>
