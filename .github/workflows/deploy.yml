name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Deploy
        run: |
          set -e

          echo "=== Pull codi ==="
          cd /opt/amg
          git pull origin main

          echo "=== Build imatges ==="
          cd /opt/amg/infra
          docker compose --env-file /opt/amg/.env build backend frontend

          echo "=== Reiniciar serveis ==="
          docker compose --env-file /opt/amg/.env up -d --no-deps --force-recreate backend frontend

          echo "=== Esperar que el backend arrenqui (Flyway + seeders) ==="
          for i in $(seq 1 24); do
            STATUS=$(docker inspect amg_backend --format '{{.State.Health.Status}}' 2>/dev/null || echo "starting")
            echo "  intent $i: $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "Backend healthy"
              break
            fi
            if [ "$i" = "24" ]; then
              echo "ERROR: Backend no ha arrencat en 120s" >&2
              docker logs --tail 50 amg_backend >&2
              exit 1
            fi
            sleep 5
          done

          echo "=== Deploy completat ==="
          docker ps --filter "name=amg_" --format "{{.Names}}\t{{.Status}}"
